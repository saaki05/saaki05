<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 210" width="1200" height="210" role="img" aria-label="1,232+ CodeChef problems solved, 350+ LeetCode problems solved, Blue-rated on CodeChef with a Silver Badge, 10+ projects built and deployed.">
  <style>
  svg { --bg:#efe9dd; --fg:#15130f; --mu:#655f54; --ln:rgba(21,19,15,.17); --card:rgba(21,19,15,.035); }
  @media (prefers-color-scheme: dark) {
    svg { --bg:#100f0d; --fg:#efe9dd; --mu:#a39d90; --ln:rgba(239,233,221,.18); --card:rgba(239,233,221,.045); }
  }
  .bg { fill:var(--bg); } .fg { fill:var(--fg); } .mu { fill:var(--mu); }
  .ln { stroke:var(--ln); fill:none; } .sfg { stroke:var(--fg); fill:none; }
  .card { fill:var(--card); stroke:var(--ln); }
  .serif { font-family:Georgia, 'Iowan Old Style', 'Times New Roman', serif; } .it { font-style:italic; }
  .mono { font-family:ui-monospace, 'SF Mono', 'JetBrains Mono', Menlo, Consolas, monospace; letter-spacing:.14em; }
  .sans { font-family:-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .dash { stroke-dasharray:4 7; animation:dash 1.6s linear infinite; }
  .pulse { transform-box:fill-box; transform-origin:center; animation:pulse 3.2s ease-in-out infinite; }
  .rise { animation:rise 1.1s cubic-bezier(.2,.7,.1,1) both; }
  .fade { animation:fade 1.4s ease both; }
  @keyframes dash { to { stroke-dashoffset:-22; } }
  @keyframes pulse { 50% { transform:scale(1.2); } }
  @keyframes rise { from { transform:translateY(46px); opacity:0; } }
  @keyframes fade { from { opacity:0; } }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
  <defs>
    <linearGradient id="ramp" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6d4bff"/><stop offset=".36" stop-color="#d23bb0"/>
      <stop offset=".68" stop-color="#fa5433"/><stop offset="1" stop-color="#ffb321"/>
    </linearGradient>
    <radialGradient id="heat" gradientUnits="userSpaceOnUse" cx="600" cy="105" r="520">
      <stop offset="0" stop-color="#ffbd2e"/><stop offset=".3" stop-color="#fa5433"/>
      <stop offset=".58" stop-color="#c22fa6"/><stop offset=".84" stop-color="#5b3fe0" stop-opacity=".75"/>
      <stop offset="1" stop-color="#5b3fe0" stop-opacity="0"/><animate attributeName="cx" values="200;1000;200" dur="20s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/><animate attributeName="cy" values="105;105;105" dur="20s" repeatCount="indefinite" calcMode="spline" keySplines=".4 0 .6 1;.4 0 .6 1"/>
    </radialGradient>
    <clipPath id="frame"><rect width="1200" height="210" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
    <rect class="bg" width="1200" height="210"/>
<rect width="1200" height="210" fill="url(#heat)" opacity=".1"/>
<path class="sfg" d="M56 44 H300" stroke-width="1"/><text class="serif fg rise" x="56" y="138" font-size="76" letter-spacing="-3.2" style="animation-delay:0.0s">1,232<tspan class="it" fill="url(#ramp)">+</tspan></text><text class="mono mu" x="56" y="174" font-size="10.5">CODECHEF PROBLEMS SOLVED</text>
<path class="sfg" d="M328 44 H572" stroke-width="1"/><text class="serif fg rise" x="328" y="138" font-size="76" letter-spacing="-3.2" style="animation-delay:0.12s">350<tspan class="it" fill="url(#ramp)">+</tspan></text><text class="mono mu" x="328" y="174" font-size="10.5">LEETCODE PROBLEMS SOLVED</text>
<path class="sfg" d="M600 44 H844" stroke-width="1"/><text class="serif fg rise" x="600" y="138" font-size="76" letter-spacing="-3.2" style="animation-delay:0.24s">Blue<tspan class="it" fill="url(#ramp)"></tspan></text><text class="mono mu" x="600" y="174" font-size="10.5">CODECHEF RATING · SILVER BADGE</text>
<path class="sfg" d="M872 44 H1116" stroke-width="1"/><text class="serif fg rise" x="872" y="138" font-size="76" letter-spacing="-3.2" style="animation-delay:0.36s">10<tspan class="it" fill="url(#ramp)">+</tspan></text><text class="mono mu" x="872" y="174" font-size="10.5">PROJECTS BUILT AND DEPLOYED</text>
  </g>
  <rect class="ln" x=".5" y=".5" width="1199" height="209" rx="20"/>
</svg>
